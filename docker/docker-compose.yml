services:
  pgsql:
    image: ${POSTGRES_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    container_name: aura-pgsql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${PG_TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "timezone=${PG_TIMEZONE:-Asia/Shanghai}", "-c", "log_timezone=${PG_TIMEZONE:-Asia/Shanghai}"]
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-pgsql-data:/var/lib/postgresql/data
      - ../database/schema.pgsql.sql:/docker-entrypoint-initdb.d/01-schema.pgsql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    container_name: aura-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aura-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  arangodb:
    image: ${ARANGO_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    container_name: aura-arangodb
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    ports:
      - "${ARANGO_BIND_ADDRESS:-127.0.0.1}:${ARANGO_PORT:-8529}:8529"
    volumes:
      - aura-arango-data:/var/lib/arangodb3

  arango-init:
    image: ${ARANGO_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    container_name: aura-arango-init
    restart: "no"
    depends_on:
      - arangodb
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
      ARANGO_DB: ${ARANGO_DB}
      ARANGO_GRAPH_DB: ${ARANGO_GRAPH_DB:-aura_graph}
      ARANGO_GRAPH_USER: ${ARANGO_GRAPH_USER:-aura_graph}
      ARANGO_GRAPH_PASSWORD: ${ARANGO_GRAPH_PASSWORD:-${ARANGO_ROOT_PASSWORD}}
    entrypoint: ["sh", "-c"]
    command:
      - "until arangosh --server.endpoint tcp://arangodb:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string \"db._version()\" >/dev/null 2>&1; do echo \"Waiting for ArangoDB...\"; sleep 2; done; arangosh --server.endpoint tcp://arangodb:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string \"const env=require('internal').env; const users=require('@arangodb/users'); const legacy=env.ARANGO_DB; const graph=env.ARANGO_GRAPH_DB; const user=env.ARANGO_GRAPH_USER; const password=env.ARANGO_GRAPH_PASSWORD; if (!db._databases().includes(legacy)) db._createDatabase(legacy); if (!db._databases().includes(graph)) db._createDatabase(graph, {}, [{username:user,passwd:password,active:true}]); if (!users.exists(user)) users.save(user,password,true); else users.update(user,password,true); users.grantDatabase(user,graph,'rw');\""

  ai:
    image: ${AI_IMAGE:-aura-ai:local}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../
      dockerfile: docker/ai.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE}
    container_name: aura-ai
    restart: unless-stopped
    depends_on:
      arango-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARANGO_URI: http://arangodb:8529
      ARANGO_DB: ${ARANGO_DB}
      ARANGO_USER: ${ARANGO_USER:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-${ARANGO_ROOT_PASSWORD}}
      AURA_AI_REQUIRE_ARANGO: ${AURA_AI_REQUIRE_ARANGO:-true}
      AURA_MODEL_PATH: ${AURA_MODEL_PATH}
      AURA_API_KEY: ${AURA_API_KEY:-}
      AURA_AI_INFER_BATCH_SIZE: ${AURA_AI_INFER_BATCH_SIZE:-16}
      AURA_AI_INFER_MAX_WAIT_SECONDS: ${AURA_AI_INFER_MAX_WAIT_SECONDS:-0.05}
      AURA_AI_INFER_QUEUE_MAX_SIZE: ${AURA_AI_INFER_QUEUE_MAX_SIZE:-256}
      AURA_AI_INFER_ENQUEUE_TIMEOUT_SECONDS: ${AURA_AI_INFER_ENQUEUE_TIMEOUT_SECONDS:-0.2}
      AURA_AI_SEARCH_RATE_LIMIT_PER_MINUTE: ${AURA_AI_SEARCH_RATE_LIMIT_PER_MINUTE:-600}
      AURA_AI_BREAKER_FAIL_THRESHOLD: ${AURA_AI_BREAKER_FAIL_THRESHOLD:-8}
      AURA_AI_BREAKER_OPEN_SECONDS: ${AURA_AI_BREAKER_OPEN_SECONDS:-20}
      AURA_AI_HEALTH_VERBOSE: ${AURA_AI_HEALTH_VERBOSE:-false}
      AURA_AI_EXTRACT_FILE_ROOTS: ${AURA_AI_EXTRACT_FILE_ROOTS:-}
      AURA_AI_MAX_IMAGE_BASE64_CHARS: ${AURA_AI_MAX_IMAGE_BASE64_CHARS:-20000000}
      AURA_AI_MAX_IMAGE_PIXELS: ${AURA_AI_MAX_IMAGE_PIXELS:-16000000}
      AURA_AI_ALLOWED_IMAGE_FORMATS: ${AURA_AI_ALLOWED_IMAGE_FORMATS:-JPEG,PNG,BMP,WEBP}
      AURA_AI_INDEX_SNAPSHOT_PATH: ${AURA_AI_INDEX_SNAPSHOT_PATH:-data/ai/local_index_snapshot.json}
      AURA_AI_MIN_SCORE_DEFAULT: ${AURA_AI_MIN_SCORE_DEFAULT:--1.0}
      AURA_AI_CANDIDATE_MULTIPLIER_DEFAULT: ${AURA_AI_CANDIDATE_MULTIPLIER_DEFAULT:-8}
      AURA_AI_CANDIDATE_POOL_DEFAULT: ${AURA_AI_CANDIDATE_POOL_DEFAULT:-0}
      AURA_AI_ANN_PROBE_DEFAULT: ${AURA_AI_ANN_PROBE_DEFAULT:-16}
      AURA_AI_RERANK_WINDOW_DEFAULT: ${AURA_AI_RERANK_WINDOW_DEFAULT:-30}
      AURA_EXTERNAL_EXTRACT_URLS: ${AURA_EXTERNAL_EXTRACT_URLS:-}
      AURA_EXTERNAL_PROJECT_NAME: ${AURA_EXTERNAL_PROJECT_NAME:-person_reid}
      AURA_EXTERNAL_MODEL_NAME: ${AURA_EXTERNAL_MODEL_NAME:-osnet_x1_0_v1.onnx}
      AURA_EXTERNAL_API_TOKEN: ${AURA_EXTERNAL_API_TOKEN:-}
      AURA_EXTERNAL_TIMEOUT_SECONDS: ${AURA_EXTERNAL_TIMEOUT_SECONDS:-10}
      AURA_GPU_PREDICT_URLS: ${AURA_GPU_PREDICT_URLS:-http://gpu-worker-0:8000/predict;http://gpu-worker-1:8000/predict}
      AURA_GPU_PROJECT_NAME: ${AURA_GPU_PROJECT_NAME:-person_reid}
      AURA_GPU_MODEL_NAME: ${AURA_GPU_MODEL_NAME:-osnet_x1_0_v1.onnx}
      AURA_GPU_API_TOKEN: ${AURA_GPU_API_TOKEN:-}
      AURA_GPU_TIMEOUT_SECONDS: ${AURA_GPU_TIMEOUT_SECONDS:-10}
    volumes:
      - ${AURA_MODEL_HOST_DIR:-../models}:/app/models:ro
    ports:
      - "${AI_BIND_ADDRESS:-127.0.0.1}:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - default
      - gpu-bridge

  db-migrate:
    image: ${API_IMAGE:-aura-api:local}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
    container_name: aura-db-migrate
    restart: "no"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ConnectionStrings__PgSql: Host=pgsql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timezone=${PG_TIMEZONE:-Asia/Shanghai}
    entrypoint: ["dotnet", "/app/migrator/Aura.DbMigrator.dll"]
    command: ["migrate", "--command-timeout", "${DB_MIGRATION_COMMAND_TIMEOUT_SECONDS:-300}", "--lock-timeout", "${DB_MIGRATION_LOCK_TIMEOUT_SECONDS:-60}"]
    depends_on:
      pgsql:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-aura-api:local}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
    container_name: aura-api
    restart: unless-stopped
    depends_on:
      arango-init:
        condition: service_completed_successfully
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      AllowedHosts: ${ALLOWEDHOSTS}
      ConnectionStrings__PgSql: Host=pgsql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timezone=${PG_TIMEZONE:-Asia/Shanghai}
      ConnectionStrings__Redis: redis:6379
      Ai__BaseUrl: http://ai:8000
      Ai__BaseUrls: ${AI_BASE_URLS:-}
      Ai__ApiKey: ${AURA_API_KEY:-}
      MediaAnalysis__PublicWebhookUrl: ${MEDIA_ANALYSIS_PUBLIC_WEBHOOK_URL:-http://aura-api:5000/api/integrations/media-analysis/v1/events}
      MediaAnalysis__Workers__Enabled: ${MEDIA_ANALYSIS_WORKERS_ENABLED:-true}
      MEDIA_ANALYSIS_PROVIDER_SECRET: ${MEDIA_ANALYSIS_PROVIDER_SECRET:-}
      MEDIA_ANALYSIS_WEBHOOK_SECRET: ${MEDIA_ANALYSIS_WEBHOOK_SECRET:-}
      MediaAnalysis__Http__TotalTimeoutSeconds: ${MEDIA_ANALYSIS_HTTP_TOTAL_TIMEOUT_SECONDS:-120}
      MediaAnalysis__Http__AttemptTimeoutSeconds: ${MEDIA_ANALYSIS_HTTP_ATTEMPT_TIMEOUT_SECONDS:-30}
      MediaAnalysis__Http__ConnectTimeoutSeconds: ${MEDIA_ANALYSIS_HTTP_CONNECT_TIMEOUT_SECONDS:-10}
      MediaAnalysis__Http__MaxRetryAttempts: ${MEDIA_ANALYSIS_HTTP_MAX_RETRY_ATTEMPTS:-2}
      MediaAnalysis__Http__MaxRequestBytes: ${MEDIA_ANALYSIS_HTTP_MAX_REQUEST_BYTES:-1048576}
      MediaAnalysis__Http__MaxResponseBytes: ${MEDIA_ANALYSIS_HTTP_MAX_RESPONSE_BYTES:-4194304}
      MediaAnalysis__OutboundSecurity__AllowedHosts__0: ${MEDIA_ANALYSIS_OUTBOUND_ALLOWED_HOST_0:-}
      MediaAnalysis__OutboundSecurity__AllowedHosts__1: ${MEDIA_ANALYSIS_OUTBOUND_ALLOWED_HOST_1:-}
      MediaAnalysis__OutboundSecurity__AllowedHosts__2: ${MEDIA_ANALYSIS_OUTBOUND_ALLOWED_HOST_2:-}
      MediaAnalysis__OutboundSecurity__AllowPrivateNetworks: ${MEDIA_ANALYSIS_OUTBOUND_ALLOW_PRIVATE_NETWORKS:-false}
      MediaAnalysis__OutboundSecurity__AllowHttp: ${MEDIA_ANALYSIS_OUTBOUND_ALLOW_HTTP:-false}
      MediaAnalysis__Http__Mtls__CertificatePath: ${MEDIA_ANALYSIS_MTLS_CERTIFICATE_PATH:-}
      MediaAnalysis__Http__Mtls__CertificatePasswordEnvironmentVariable: ${MEDIA_ANALYSIS_MTLS_CERTIFICATE_PASSWORD_ENVIRONMENT_VARIABLE:-}
      VectorIndex__ReadEngine: ${VECTOR_INDEX_READ_ENGINE:-pgvector}
      VectorIndex__WriteMode: ${VECTOR_INDEX_WRITE_MODE:-pgvector}
      VectorIndex__AllowLegacyReadFallback: ${VECTOR_INDEX_ALLOW_LEGACY_READ_FALLBACK:-false}
      Graph__Enabled: ${GRAPH_ENABLED:-true}
      Graph__Arango__BaseUrl: http://arangodb:8529
      Graph__Arango__Database: ${ARANGO_GRAPH_DB:-aura_graph}
      Graph__Arango__GraphName: ${ARANGO_GRAPH_NAME:-aura_domain}
      Graph__Arango__Username: ${ARANGO_GRAPH_USER:-aura_graph}
      Graph__Arango__Password: ${ARANGO_GRAPH_PASSWORD:-${ARANGO_ROOT_PASSWORD}}
      Graph__Arango__QueryMaxRuntimeSeconds: ${ARANGO_GRAPH_QUERY_MAX_RUNTIME_SECONDS:-15}
      Graph__Arango__ConnectTimeoutSeconds: ${ARANGO_GRAPH_CONNECT_TIMEOUT_SECONDS:-10}
      Graph__Arango__MaxResponseBytes: ${ARANGO_GRAPH_MAX_RESPONSE_BYTES:-16777216}
      SignalR__RedisBackplane__Enabled: ${SIGNALR__REDISBACKPLANE__ENABLED:-false}
      SignalR__RedisBackplane__ConnectionString: redis:6379
      SignalR__RedisBackplane__ChannelPrefix: ${SIGNALR__REDISBACKPLANE__CHANNELPREFIX:-aura:signalr}
      CommercialProduct__Mobile__WebPushPublicKey: ${COMMERCIAL_WEB_PUSH_PUBLIC_KEY:-}
      Jwt__Key: ${JWT__KEY}
      Security__HmacSecret: ${SECURITY__HMACSECRET}
      Security__Cookies__ForceSecure: ${SECURITY__COOKIES__FORCESECURE:-true}
      Security__ForwardedHeaders__Enabled: ${SECURITY__FORWARDEDHEADERS__ENABLED:-true}
      Security__ForwardedHeaders__ForwardLimit: ${SECURITY__FORWARDEDHEADERS__FORWARDLIMIT:-2}
      Security__ForwardedHeaders__KnownNetworks__0: ${SECURITY__FORWARDEDHEADERS__KNOWNNETWORKS__0:-10.0.0.0/8}
      Security__ForwardedHeaders__KnownNetworks__1: ${SECURITY__FORWARDEDHEADERS__KNOWNNETWORKS__1:-172.16.0.0/12}
      Security__ForwardedHeaders__KnownNetworks__2: ${SECURITY__FORWARDEDHEADERS__KNOWNNETWORKS__2:-192.168.0.0/16}
      Ops__Alert__WebhookUrl: ${OPS__ALERT__WEBHOOKURL:-}
      Ops__Alert__FilePath: ${OPS__ALERT__FILEPATH:-/app/storage/logs/alert-notify.log}
      Ops__Metrics__ExposePrometheus: ${OPS__METRICS__EXPOSEPROMETHEUS:-false}
      Ops__Telemetry__EnableTracing: ${OPS__TELEMETRY__ENABLETRACING:-false}
      Ops__Telemetry__OtlpEndpoint: ${OPS__TELEMETRY__OTLPENDPOINT:-}
      Ops__Telemetry__OtlpProtocol: ${OPS__TELEMETRY__OTLPPROTOCOL:-Grpc}
      AURA_ADMIN_USER: ${AURA_ADMIN_USER}
      AURA_ADMIN_PASSWORD: ${AURA_ADMIN_PASSWORD}
      Paths__FrontendRoot: ${PATHS__FRONTENDROOT:-/app/frontend}
    volumes:
      - ${FRONTEND_HOST_DIR:-../frontend}:/app/frontend:ro
      - aura-api-storage:/app/storage
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health/live >/dev/null 2>&1 || curl -fsS http://127.0.0.1:5000/api/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  media-provider-simulator:
    profiles: ["dev-tools"]
    image: ${MEDIA_PROVIDER_SIMULATOR_IMAGE:-aura-media-provider-simulator:local}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../
      dockerfile: tools/Aura.MediaAnalysis.ProviderSimulator/Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE}
        DOTNET_ASPNET_IMAGE: ${DOTNET_ASPNET_IMAGE}
    container_name: aura-media-provider-simulator
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Simulator__ProviderCode: ${MEDIA_PROVIDER_SIMULATOR_CODE:-simulator}
      Simulator__TenantCode: ${MEDIA_PROVIDER_SIMULATOR_TENANT:-aura-default}
      Simulator__WebhookSecret: ${MEDIA_PROVIDER_SIMULATOR_SECRET:-development-only-secret}
      Simulator__AuraWebhookUrl: http://api:5000/api/integrations/media-analysis/v1/events
    ports:
      - "${MEDIA_PROVIDER_SIMULATOR_BIND_ADDRESS:-127.0.0.1}:${MEDIA_PROVIDER_SIMULATOR_PORT:-18080}:8080"

networks:
  gpu-bridge:
    external: true

volumes:
  aura-pgsql-data:
  aura-redis-data:
  aura-arango-data:
  aura-api-storage:
