name: dotnet-ci

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "ai/**"
      - "frontend/**"
      - "frontend-overrides/**"
      - "start_services.py"
      - "database/**"
      - "Aura.sln"
      - ".github/workflows/**"
      - ".editorconfig"
      - ".env.example"
      - "Directory.Build.props"
      - "global.json"
      - "deploy/**"
      - "adapters/**"
      - "docs/**"
      - "scripts/**"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "ai/**"
      - "frontend/**"
      - "frontend-overrides/**"
      - "start_services.py"
      - "database/**"
      - "Aura.sln"
      - ".github/workflows/**"
      - ".editorconfig"
      - ".env.example"
      - "Directory.Build.props"
      - "global.json"
      - "deploy/**"
      - "adapters/**"
      - "docs/**"
      - "scripts/**"

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai: ${{ steps.filter.outputs.ai }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend/frontend/ai changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - "backend/**"
              - "Aura.sln"
              - "database/**"
              - ".github/workflows/**"
              - ".editorconfig"
              - ".env.example"
              - "Directory.Build.props"
              - "global.json"
              - "deploy/**"
              - "adapters/**"
              - "docs/**"
              - "scripts/**"
            frontend:
              - "frontend/**"
              - "frontend-overrides/**"
              - ".github/workflows/**"
              - ".editorconfig"
              - ".env.example"
            ai:
              - "ai/**"
              - "start_services.py"
              - ".github/workflows/**"
              - ".editorconfig"
              - ".env.example"

  backend:
    name: Backend Build And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Build.props', 'Aura.sln', 'backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore "${{ github.workspace }}/Aura.sln" -p:Configuration=Release

      - name: Validate commercial artifacts and contracts
        run: python "${{ github.workspace }}/scripts/ops/validate-commercial-artifacts.py"

      - name: Build solution
        run: dotnet build "${{ github.workspace }}/Aura.sln" -c Release --no-restore

      - name: Check NuGet vulnerabilities
        env:
          Configuration: Release
        run: dotnet list "${{ github.workspace }}/Aura.sln" package --vulnerable --include-transitive --no-restore

      - name: Run backend unit tests
        run: dotnet test "${{ github.workspace }}/backend/Aura.Api.Tests/Aura.Api.Tests.csproj" -c Release --no-build --no-restore --verbosity normal

      - name: Run backend integration tests
        run: dotnet test "${{ github.workspace }}/backend/Aura.Api.Integration.Tests/Aura.Api.Integration.Tests.csproj" -c Release --no-build --no-restore --verbosity normal

  ai:
    name: AI Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.ai == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt

      - name: Install AI test dependencies
        working-directory: ai
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check AI Python dependencies
        working-directory: ai
        run: python -m pip check

      - name: Run AI tests
        working-directory: ai
        run: python -m pytest -p no:cacheprovider

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Check frontend override scripts
        shell: bash
        run: |
          if [ -d "frontend-overrides" ]; then
            find frontend-overrides -type f -name '*.js' | sort | while IFS= read -r file; do
              [ -n "$file" ] || continue
              node --check "$file"
            done
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - backend
      - ai
      - frontend

    steps:
      - name: Summarize CI results
        shell: bash
        env:
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          AI_RESULT: ${{ needs.ai.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Area | Changed | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detect Changes | n/a | ${DETECT_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | ${BACKEND_CHANGED} | ${BACKEND_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI | ${AI_CHANGED} | ${AI_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${FRONTEND_CHANGED} | ${FRONTEND_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Change detection failed or was cancelled." >&2
            exit 1
          fi

          if [[ "$BACKEND_CHANGED" == "true" && "$BACKEND_RESULT" != "success" ]]; then
            echo "Backend checks failed or were cancelled." >&2
            exit 1
          fi

          if [[ "$AI_CHANGED" == "true" && "$AI_RESULT" != "success" ]]; then
            echo "AI checks failed or were cancelled." >&2
            exit 1
          fi

          if [[ "$FRONTEND_CHANGED" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend checks failed or were cancelled." >&2
            exit 1
          fi
