# Dependabot：依赖与安全更新 PR（可按组织策略调整频率与审查人）
#
# 策略说明：
# 1. 补丁/次版本更新按生态分组，合并为单个 PR，避免分支堆积；
# 2. 主版本更新仍单独开 PR，便于逐个评审；
# 3. 与框架包存在硬约束的依赖（见各 ignore 注释）不接受自动主版本升级，
#    需人工排期并配合集成测试验证。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend/Aura.Api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Microsoft.OpenApi 2.7.5 是安全覆盖：Microsoft.AspNetCore.OpenApi 10.0.x
      # 传递依赖的 2.0.0 命中 GHSA-v5pm-xwqc-g5wc，故显式固定到 2.7.5
      # （见 2026-07-03-fix-optimization-notes.md）。该引用不可删除，
      # 且必须留在 2.x 线上与框架包保持一致；本项目未直接使用其类型，
      # 仅调用 AddOpenApi/MapOpenApi，升到 3.x 无收益。
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
      # Microsoft.AspNetCore.SignalR.StackExchangeRedis 10.0.x 针对
      # StackExchange.Redis 2.x 编译，主版本升级存在运行时二进制不兼容风险。
      - dependency-name: StackExchange.Redis
        update-types:
          - version-update:semver-major
      # 既有决策：保持 Npgsql 在 8.x 线，避免跨大版本升级带来运行时兼容风险
      # （见 CHANGELOG.md）。该包为数据访问层核心依赖，且需与 Aura.DbMigrator
      # 同步升级，主版本升级须人工排期并跑集成测试。
      - dependency-name: Npgsql
        update-types:
          - version-update:semver-major

  # Aura.DbMigrator 与 Aura.Api 共用 Npgsql，缺少此条目会导致两者版本分叉
  - package-ecosystem: nuget
    directory: /backend/Aura.DbMigrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dbmigrator-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # 须与 Aura.Api 的 Npgsql 版本保持一致，同样人工排期
      - dependency-name: Npgsql
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: /backend/Aura.Api.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      test-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /backend/Aura.Api.Integration.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      integration-test-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ai-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # eslint 与 @eslint/js、globals 必须同步升级，否则扁平配置会因
      # js.configs.recommended 版本错配而失败
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - globals
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
